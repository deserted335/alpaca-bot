services:
  bot:
    build: .
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_OWNER_ID: ${DISCORD_OWNER_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_MESSAGE_CONTENT: ${LOG_MESSAGE_CONTENT:-false}
    networks:
      - default
      - jobs
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      CLAUDE_VOLUME: ${COMPOSE_PROJECT_NAME:-alpaca-bot}_claude-home
      CLAUDE_IMAGE: alpaca-bot-claude
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - jobs
  claude:
    profiles: ["manual"]
    image: alpaca-bot-claude
    build:
      context: .
      dockerfile: Dockerfile.claude
    volumes:
      - claude-home:/home/claude

volumes:
  claude-home:

networks:
  jobs:
    internal: true
